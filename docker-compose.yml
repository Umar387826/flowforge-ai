services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flowforge_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-flowforge_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-flowforge_owner_dev_pass}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-flowforge_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-flowforge_app_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infra/postgres/02_sync_app_role.sh:/docker-entrypoint-initdb.d/02_sync_app_role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-flowforge_owner} -d ${POSTGRES_DB:-flowforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_APP_USER: ${POSTGRES_OWNER_USER:-flowforge_owner}
      POSTGRES_APP_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-flowforge_owner_dev_pass}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py sync_tenant_key &&
             python manage.py collectstatic --noinput"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - static_volume:/app/backend/staticfiles

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: flowforge_backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    volumes:
      - media_volume:/app/backend/media
      - static_volume:/app/backend/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: flowforge_celery_worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
    command: celery -A config worker -l INFO -Q default,documents,workflows,integrations --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    volumes:
      - media_volume:/app/backend/media

  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: flowforge_celery_beat
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: flowforge_frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: flowforge_nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_volume:
    external: true
    name: flowai_media_volume
  static_volume:

